# Microservice Configuration
spring.application.name=account-service
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/account_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# OAuth2 Resource Server Configuration (connects to auth-service)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/banking
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/banking/protocol/openid-connect/certs

# Microservices Communication
# Transaction Service URL (for future integration)
transaction.service.url=http://localhost:8082
auth.service.url=http://localhost:8080

# Service Discovery (if using Eureka/Consul)
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# eureka.instance.prefer-ip-address=true

# Logging Configuration
logging.level.com.account.account_service=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Management endpoints for microservices monitoring
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.metrics.export.simple.enabled=true

# Actuator configuration for microservices
management.endpoints.web.base-path=/actuator
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true